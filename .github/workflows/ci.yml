name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default token (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "latest"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad imagemagick shellcheck tesseract-ocr tesseract-ocr-rus mtools xz-utils
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Run ruff
        run: uv run ruff check lib/ tests/ packages/threed-vision/src
      - name: Run shellcheck
        # Same file discovery as the local gate (tests/run_gate.py); `command -v` fails the
        # step if the binary is missing here, where the local gate would only SKIP.
        run: |
          command -v shellcheck
          uv run python -c 'import sys; sys.path.insert(0, "tests"); import run_gate; sys.exit(run_gate.run_shellcheck("."))'
      - name: Run yamllint (Home Assistant integration)
        run: uv run yamllint --strict -c integrations/homeassistant/.yamllint integrations/homeassistant
      - name: Run pytest with coverage
        run: uv run pytest tests/ integrations/homeassistant/tests/ --cov=lib --cov-fail-under=80 -q
      - name: Run mypy
        run: uv run mypy lib/ tests/ packages/threed-vision/src/threed_vision
