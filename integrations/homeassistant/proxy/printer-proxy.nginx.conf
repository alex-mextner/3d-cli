worker_processes 1;

events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_forwarded_proto $external_scheme {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  map $http_x_forwarded_host $external_host {
    default $http_x_forwarded_host;
    '' $http_host;
  }

  server {
    listen 8080;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /k1se/ {
      proxy_pass http://192.168.0.27/;
      proxy_set_header Host 192.168.0.27;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter_types application/javascript text/javascript;
      sub_filter 'pa=new la(' 'pa=new la((location.protocol==="https:"?"wss://":"ws://")+location.host+"/api/ingress/k1_se_printer/k1se-socket/"),/*';
      sub_filter ':9999`),pa.init()' '*/pa.init()';
    }

    location /k1se/k1se-socket/ {
      proxy_pass http://192.168.0.27:9999/;
      proxy_set_header Host 192.168.0.27:9999;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /u1/config.json {
      default_type application/json;
      add_header Cache-Control "no-store";
      return 200 '{"blacklist":["fluidd.xyz","fluidd.net"],"endpoints":["$external_scheme://$external_host/api/ingress/u1_printer"],"hosted":false,"themePresets":[]}';
    }

    location /u1/ {
      proxy_pass http://192.168.0.26/;
      proxy_set_header Host 192.168.0.26;
      proxy_set_header Origin http://192.168.0.26;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Accept-Encoding "";
      sub_filter_once on;
      sub_filter '</head>' '<script>try{const p="/api/ingress/u1_printer",api=location.protocol+"//"+location.host+p,ws=(location.protocol==="https:"?"wss://":"ws://")+location.host+p+"/websocket",k="appInstances",raw=localStorage.getItem(k);if(raw){const apps=JSON.parse(raw);let changed=false;if(Array.isArray(apps)){for(const app of apps){if(app&&typeof app.apiUrl==="string"&&app.apiUrl.includes(p)){if(app.apiUrl!==api){app.apiUrl=api;changed=true}if(app.socketUrl!==ws){app.socketUrl=ws;changed=true}if(!app.name||app.name==="fluidd"){app.name="U1";changed=true}app.active=true}}if(changed)localStorage.setItem(k,JSON.stringify(apps))}}}catch(e){}</script></head>';
    }
  }
}
