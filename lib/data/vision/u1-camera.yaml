fit:
  source: 'region fit, then a top-edge polish, from the edge-line fit (u1-camera-features.yaml):
    the walls of u1_walls_main_v3 up to each frame''s layer are painted far-to-near; Powell
    maximises the IoU of the visible green (T2) wall surfaces with the green pixels (pose,
    focal, cx/cy, k1), then refines the pose against IoU plus the distance of the current
    layer''s visible top outline to the green parts'' upper boundary'
