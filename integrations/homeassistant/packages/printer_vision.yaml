# GENERATED by `3d ha vision` from fleet/printers.yaml (and lib/data/vision calibrations): do not
# edit; change the fleet entry, run `3d ha vision --write` and commit. Needs in the HA repo's
# secrets.yaml:  printops_api_auth: "Bearer <3d-api token, scope read>"  (packages/printops_tasks.yaml).
#
# Per printer with a camera (watch.vision.camera):
#   sensor.printer_<slug>_vision_verdict   q of the last frame (else p); attributes: state, file, p, q,
#                                          trend, luma, findings, frames, age_s, camera_error
#   sensor.printer_<slug>_vision_events    events raised by the running `3d printer vision`;
#                                          attributes: events {total, by_kind}, last_event
#   binary_sensor.printer_<slug>_vision_{printing,paused,alive}   alive = the status is fresher than
#                                          generate.alive_max_age_s, i.e. the vision loop is running
#   sensor.printer_<slug>_alert_snapshot   the frame script.printer_send_notification attaches to a phone alert
# Per printer with a bundled camera calibration (the ghost of the rest of the print on its camera):
#   input_boolean.<printer>_camera_ghost, rest_command.<printer>_camera_ghost_set, a sync automation.
#
# k1se: NO ghost — no bundled camera calibration for Creality K1 SE
#   (lib/data/vision, lib/vision_geometry.py _BUNDLED); the sensors and the live camera need none.

rest:
  - resource: "http://192.168.0.39:8765/v1/printers/u1/vision"
    headers:
      Authorization: !secret printops_api_auth
    scan_interval: 30
    timeout: 10
    sensor:
      - name: "Printer U1 Vision Verdict"
        unique_id: printer_u1_vision_verdict
        icon: mdi:eye-check-outline
        state_class: measurement
        value_template: "{% set v = value_json.q if value_json.q is not none else value_json.p %}{{ 'unknown' if v is none else v }}"
        json_attributes: [state, file, p, q, trend, luma, findings, frames, age_s, camera_error]
      - name: "Printer U1 Vision Events"
        unique_id: printer_u1_vision_events
        icon: mdi:alert-circle-outline
        state_class: measurement
        value_template: "{{ value_json.events.total }}"
        json_attributes: [events, last_event]
    binary_sensor:
      - name: "Printer U1 Vision Printing"
        unique_id: printer_u1_vision_printing
        value_template: "{{ value_json.state == 'printing' }}"
      - name: "Printer U1 Vision Paused"
        unique_id: printer_u1_vision_paused
        value_template: "{{ value_json.state == 'paused' }}"
      - name: "Printer U1 Vision Alive"
        unique_id: printer_u1_vision_alive
        device_class: connectivity
        value_template: "{{ value_json.age_s < 120 }}"
  - resource: "http://192.168.0.39:8765/v1/printers/k1se/vision"
    headers:
      Authorization: !secret printops_api_auth
    scan_interval: 30
    timeout: 10
    sensor:
      - name: "Printer K1 SE Vision Verdict"
        unique_id: printer_k1_se_vision_verdict
        icon: mdi:eye-check-outline
        state_class: measurement
        value_template: "{% set v = value_json.q if value_json.q is not none else value_json.p %}{{ 'unknown' if v is none else v }}"
        json_attributes: [state, file, p, q, trend, luma, findings, frames, age_s, camera_error]
      - name: "Printer K1 SE Vision Events"
        unique_id: printer_k1_se_vision_events
        icon: mdi:alert-circle-outline
        state_class: measurement
        value_template: "{{ value_json.events.total }}"
        json_attributes: [events, last_event]
    binary_sensor:
      - name: "Printer K1 SE Vision Printing"
        unique_id: printer_k1_se_vision_printing
        value_template: "{{ value_json.state == 'printing' }}"
      - name: "Printer K1 SE Vision Paused"
        unique_id: printer_k1_se_vision_paused
        value_template: "{{ value_json.state == 'paused' }}"
      - name: "Printer K1 SE Vision Alive"
        unique_id: printer_k1_se_vision_alive
        device_class: connectivity
        value_template: "{{ value_json.age_s < 120 }}"

command_line:
  - sensor:
      name: "Printer U1 Alert Snapshot"
      unique_id: printer_u1_alert_snapshot
      icon: mdi:camera
      scan_interval: 315360000
      command_timeout: 10
      command: >-
        d=/media/printer-alerts; f=u1-$(date +%Y%m%d-%H%M%S)-$$.jpg; mkdir -p "$d" &&
        if curl -fsS --connect-timeout 2 --max-time 5 -o "$d/$f" 'http://u1-camera-proxy:8090/u1.jpg'
        && [ "$(head -c 2 "$d/$f" | od -An -tx1 | tr -d ' \n')" = ffd8 ];
        then echo "printer-alerts/$f"; else rm -f "$d/$f"; echo failed; fi;
        ls -1t "$d"/u1-*.jpg 2>/dev/null | tail -n +31 | xargs -r rm -f
  - sensor:
      name: "Printer K1 SE Alert Snapshot"
      unique_id: printer_k1_se_alert_snapshot
      icon: mdi:camera
      scan_interval: 315360000
      command_timeout: 10
      command: >-
        d=/media/printer-alerts; f=k1_se-$(date +%Y%m%d-%H%M%S)-$$.jpg; mkdir -p "$d" &&
        if curl -fsS --connect-timeout 2 --max-time 5 -o "$d/$f" 'http://go2rtc:1984/api/frame.jpeg?src=k1se_camera'
        && [ "$(head -c 2 "$d/$f" | od -An -tx1 | tr -d ' \n')" = ffd8 ];
        then echo "printer-alerts/$f"; else rm -f "$d/$f"; echo failed; fi;
        ls -1t "$d"/k1_se-*.jpg 2>/dev/null | tail -n +31 | xargs -r rm -f

rest_command:
  u1_camera_ghost_set:
    url: "http://u1-camera-proxy:8090/ghost"
    method: post
    content_type: "application/json"
    payload: '{"enabled": {{ enabled | bool | tojson }}}'
    timeout: 10

input_boolean:
  u1_camera_ghost:
    name: "U1: призрак остатка на камере"
    icon: mdi:cube-outline
    # No `initial:` — it would override the restored state on every HA start. A new helper
    # starts off; turn it on once after the first deploy (input_boolean.turn_on).

automation:
  # A proxy forgets its switch when its container restarts; re-sending every 5 minutes and at
  # HA start brings it back to the helper's position.
  - id: u1_camera_ghost_sync
    alias: "U1: призрак остатка → прокси камеры"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.u1_camera_ghost
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
    actions:
      - action: rest_command.u1_camera_ghost_set
        data:
          enabled: "{{ is_state('input_boolean.u1_camera_ghost', 'on') }}"
