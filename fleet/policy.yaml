# fleet/policy.yaml — PrintOps policy, one top-level section per concern.
# Schema: lib/printops/policy.py (sections) + the section's parser (drying: lib/printops/drying_policy.py,
# gates: lib/printops/gates_policy.py, calibrations: lib/printops/calibration_policy.py).
# Checked by tests/test_printops_drying.py, tests/test_printops_gates.py and
# tests/test_printops_calibrations.py; 3d-api re-reads it on every drying check and every calibration
# requirement/gate request, `3d print-preflight` on every run.

drying:
  # How often 3d-api re-assesses every spool and updates Spoolman `dry_state` (+ `drying.due`).
  check_every_min: 30
  # Dried less than this many days ago → `fresh`; afterwards `ok` until a limit below is hit.
  fresh_days: 3
  # Exposure ≥ limit × wet_factor → `wet` instead of `due` (drying.due is emitted for both).
  wet_factor: 2.0
  # Materials not in the table below.
  default_class: medium

  # House policy (not from a vendor): exposure limits per hygroscopic class.
  #   max_days_opened       days since `opened_at` for a spool never dried by us
  #   max_days_since_dried  days since `last_dried_at`
  #   max_rh                storage location RH (%, from its HA humidity sensor) above which the
  #                         spool is due at once
  # The class ordering follows Prusa's KB (PLA barely affected; polyamide, PP, PVA, BVOH highly
  # hygroscopic → dry before every print or store dry) and Bambu's table ("drying requirement
  # before use" Recommended vs Required; desiccant during use Optional vs Required).
  classes:
    low:     {max_days_opened: 90, max_days_since_dried: 60, max_rh: 50}
    medium:  {max_days_opened: 30, max_days_since_dried: 30, max_rh: 40}
    high:    {max_days_opened: 7,  max_days_since_dried: 14, max_rh: 30}
    extreme: {max_days_opened: 1,  max_days_since_dried: 3,  max_rh: 20}

  sources:
    bambu: https://wiki.bambulab.com/en/general/filament-guide-material-table
    prusa: https://help.prusa3d.com/article/drying-filament_332086

  # Drying recipe per material (Spoolman filament `material`, upper-case). Where both sources
  # give numbers: the LOWER temperature (stay under the softening point in a static dryer) and
  # the LONGER time. Bambu numbers are its "blast drying oven" column.
  #   PLA   bambu 55 °C/8 h, prusa 45 °C/6 h        PETG  bambu 70/8, prusa 55/6
  #   TPU   bambu 70/8, prusa 60/4-6                 ASA   bambu 80/8, prusa 80/4
  #   PC    bambu 80/8, prusa (PC Blend) 85/5        PA*   bambu 80/8-12 (PA, PA-CF/GF, PAHT)
  #   PA11  bambu PA 80/8-12, prusa (PA11-CF) 90/6   PP    prusa (PP CF/GF) 70/2-4
  #   PET-CF bambu 80/8-12                           PVA   bambu 55/8 (BVOH grouped with PVA)
  #   PVB   prusa 45/8                               ABS   bambu 80/8
  # Override per filament with Spoolman filament extra fields hygroscopic_class / drying_temp_c /
  # drying_hours (e.g. PETG HF: bambu marks drying "Required" → class high).
  materials:
    PLA:    {class: low,     temp_c: 45, hours: 8,  source: bambu+prusa}
    PVB:    {class: medium,  temp_c: 45, hours: 8,  source: prusa}
    PETG:   {class: medium,  temp_c: 55, hours: 8,  source: bambu+prusa}
    ABS:    {class: medium,  temp_c: 80, hours: 8,  source: bambu}
    ASA:    {class: medium,  temp_c: 80, hours: 8,  source: bambu+prusa}
    TPU:    {class: high,    temp_c: 60, hours: 8,  source: bambu+prusa}
    PC:     {class: high,    temp_c: 80, hours: 8,  source: bambu+prusa}
    PP:     {class: high,    temp_c: 70, hours: 4,  source: prusa}
    PET-CF: {class: high,    temp_c: 80, hours: 12, source: bambu}
    PET-GF: {class: high,    temp_c: 80, hours: 12, source: bambu}
    PA:     {class: extreme, temp_c: 80, hours: 12, source: bambu}
    PA6:    {class: extreme, temp_c: 80, hours: 12, source: bambu}
    PA11:   {class: extreme, temp_c: 80, hours: 12, source: bambu+prusa}
    PA12:   {class: extreme, temp_c: 80, hours: 12, source: bambu}
    PAHT:   {class: extreme, temp_c: 80, hours: 12, source: bambu}
    PVA:    {class: extreme, temp_c: 55, hours: 8,  source: bambu}
    BVOH:   {class: extreme, temp_c: 55, hours: 8,  source: bambu}

gates:
  # PrintOps material gates of `3d print-preflight` (#164, plan §9.1, docs/commands/print-preflight.md).
  # An offline snapshot (`3d printops gates snapshot`) older than this is a WARN: refresh it.
  snapshot_max_age_h: 24
  # block: a hard finding FAILs (preflight exit 1, `3d printer start` refuses);
  # warn: the same finding is a WARN; off: the check does not run.
  # D6 (type/vendor change blocks, lot warns) lives in loaded_filament_match (type) and, for
  # flow/PA, in calibration_current (#167).
  levels:
    printer_profile_match: block   # G-code sliced for another printer model
    nozzle_compat: block           # abrasive filament on a soft nozzle; nozzle diameter differs
    filament_temp_range: block     # nozzle/bed temperature outside the loaded filament's window
    loaded_filament_match: block   # loaded spool's type differs (FAIL); colour ΔE; vendor (WARN)
    slot_binding_known: warn       # a used head has no spool in the ledger: usage not booked
    filament_sufficient: block     # the spool's remaining interval is below what the plate needs
    drying_due: warn               # the loaded spool is due/wet per `drying:` above
    maintenance_due: block         # the head is broken (fleet usable: false), open faults
    enclosure_material: warn       # ABS/ASA/PC/PA on an open printer
    plate_material: warn           # the G-code's plate is not on hand, or a bad material/plate pair
    preset_match: block            # not the printer's `slicer:` machine/process preset (#293)
  # Per-printer overrides, e.g. `k1se: {drying_due: off}`.
  printers: {}
  # Spoolman `material` spellings → G-code `filament_type` (Orca's names).
  material_aliases:
    PLA+: PLA
    PLA-PLUS: PLA
    PETG-HF: PETG
  # CIEDE2000 between the G-code's filament_colour and the loaded spool (measured_hex, else the
  # Spoolman filament colour). ~2 is a just-noticeable difference; 25+ is another colour.
  colour:
    warn_delta_e: 10
    fail_delta_e: 25
    projects:
      - match: "*/babushkin-dom/*"
        warn_delta_e: 6
        fail_delta_e: 15
        why: "facade palette: mixes are tuned to ΔE 4-9 between neighbouring colours (print/QUEUE.md)"
  filament_sufficient:
    # Start-macro purge outside the G-code's counted extrusion (U1 SM_PRINT_PREEXTRUDE_FILAMENT
    # 30 mm ≈ 0.1 g; K1 START_PRINT line ≈ 0.5 g) rounded up; Orca's per-filament `filament used [g]`
    # already counts the prime tower and flushes [INFERENCE: Orca PrintStatistics].
    purge_g_per_tool: 2
    margin_g: 5
    margin_pct: 5
  nozzle_compat:
    # Nozzle materials that stand abrasive filament (fleet NOZZLE_MATERIALS).
    abrasive_ok: [hardened, ruby, tungsten]
    # Tokens of a material/type name that mean abrasive (PLA-CF, PA12 GF, glow-in-the-dark, wood).
    abrasive_markers: [CF, GF, AF, CARBON, GLOW, WOOD, METAL]
  enclosure_material:
    # Warp / fume-prone materials that want a closed, warm chamber (Prusa KB material guides).
    materials: [ABS, ASA, PC, PA, PA6, PA11, PA12, PAHT, PPS, HIPS]
  plate_material:
    - materials: [PETG]
      plates: [smooth_pei, high_temp_plate]
      why: "PETG bonds to smooth PEI and can tear it out: use glue stick as a separator or a textured plate (https://help.prusa3d.com/article/petg_2059)"
    - materials: [TPU]
      plates: [smooth_pei, high_temp_plate]
      why: "TPU bonds too strongly to smooth PEI: use a separator or a textured plate (https://help.prusa3d.com/article/flexible-materials_2057)"
    - materials: [ABS, ASA, PC, PA, PA6, PA11, PA12, PAHT]
      plates: [cool_plate]
      why: "the Cool Plate is for low bed temperatures (PLA/TPU); high-temperature materials do not stick (https://wiki.bambulab.com/en/general/filament-guide-material-table)"

calibrations:
  # Layers of the calibration plates' shared underlay (#320): a multi-head printer prints 1 or 2 solid
  # layers in its own contrasting filament; a single-head printer always prints exactly 1. Outside 1-2
  # fails `3d lint`.
  underlay_layers: 1
  # How strictly a missing or stale calibration is enforced (schema: lib/printops/calibration_policy.py;
  # catalog of kinds: fleet/calibrations.yaml). block = print-preflight FAIL (bypass:
  # `--accept calibration:<kind> --reason …`, logged), warn = WARN, off = not reported.
  # Defaults are the user's decision D6: a new material TYPE or VENDOR/filament on a head blocks
  # flow ratio and pressure advance; a new LOT only warns. After maintenance or a nozzle swap the
  # affected calibrations block again.
  levels:
    new_material_type: block
    new_vendor: block
    new_filament: block
    new_nozzle: block
    new_lot: warn
    invalidated: block
    expired: warn
    gcode_mismatch: block
  kinds:
    # A temperature tower is advice on top of the vendor's range (filament_temp_range, #164,
    # checks the range itself): warn on a new filament, ignore a new lot.
    temp_tower: {new_material_type: warn, new_vendor: warn, new_filament: warn, new_lot: off}
    # Slicer presets carry vendor defaults for these; measure them, but do not stop a print.
    max_volumetric_speed: warn
    retraction: warn
    # A measured colour corrects the mix model (plan §20.4, #412); a print never needs one.
    filament_color: off
  printers:
    # D7: other people's printers are never contacted and not ours to calibrate.
    p1s: off
    a1mini: off
    xecut-a1: off
    xecut-cr200b: off
