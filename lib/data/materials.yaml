#
# Optional structural fields (read by `3d strength`; a material that omits them gets generic
# defaults, and the strength report lists them as assumptions):
#   poisson          in-plane Poisson ratio (0 < nu < 0.5).
#   z_modulus_factor E across the layers / E in-plane, in (0, 1]. FDM parts are transversely
#                    isotropic: the layer plane is isotropic, the build (Z) axis is the weak one.
#                    Ahn et al. 2002 and later tensile series put the modulus loss at 5-20 % while
#                    the strength loss (layer_adhesion) is far larger.
#   strain_limit_pct permissible SHORT-TERM strain in-plane for a single snap-fit assembly, percent.
#                    Across the layers it is scaled by layer_adhesion. For repeated assembly use
#                    ~60 % of it (Bayer "Snap-Fit Joints for Plastics", Table 2 note). PLA 2.0 /
#                    PETG 4.5 / ABS 3.5 are the 10-cycle FDM (XY) figures of the FabFlow snap-fit
#                    guide; ASA is taken at the ABS value minus 0.5; TPU is a flexible, non-linear
#                    material for which this small-strain figure is only a ceiling for the
#                    linear solver.
