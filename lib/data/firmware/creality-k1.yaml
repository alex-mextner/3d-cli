      - id: install-usb-camera
        title: USB camera (mjpg-streamer) from checksummed .ipk files
        kind: manual
        automatable: false
        risk: medium
        instruction: >-
          Follow docs/printers/k1se-root-upgrade.md section 4.3 exactly: as of 2026-10-15 the Helper Script's `opkg install mjpg-streamer` fails
