# PrintOps on the Odroid: Spoolman v0.27.0 + 3d-api, compose project `printops`
# (separate from the Home Assistant compose project; deploy with `3d printops deploy`).
#
#   docker compose -p printops -f services/3d-api/compose.yaml up -d --build
#
# Paths default to the Odroid layout (/home/ultra is bind-mounted from the WD HDD
# /mnt/wd500/odroid-rt/ultra); override with PRINTOPS_DATA_DIR / PRINTOPS_BACKUP_DIR.
# Every other host (`3d init --env`, the standalone script of `3d init --env --spoolman script`)
# sets the knobs below: PRINTOPS_UID/GID (the host user that owns the bind-mounted data),
# PRINTOPS_SPOOLMAN_PORT / PRINTOPS_API_PORT, PRINTOPS_BIND_ADDR, PRINTOPS_CONTAINER_PREFIX,
# PRINTOPS_TZ, PRINTOPS_GCODE_HOST_DIR. Their defaults are the Odroid values, so its deploy is
# unchanged.
# Ports are published on PRINTOPS_BIND_ADDR, default 0.0.0.0 = all host interfaces: the Odroid sits
# behind the home router's NAT, so that means LAN + tailnet (remote access is Tailscale-only).
# Spoolman has no auth — never port-forward 7912, and on a host that is not behind such a router
# (a laptop on public Wi-Fi, a VPS) set PRINTOPS_BIND_ADDR to 127.0.0.1 or the one LAN address that
# needs it (`3d init --env --bind ADDR`; docker's own iptables rules bypass ufw/firewalld).
# 3d-api requires bearer tokens on everything but /v1/health.
name: printops

services:
  spoolman:
    image: ghcr.io/donkie/spoolman:0.27.0   # multi-arch (amd64, arm64, arm/v7)
    container_name: ${PRINTOPS_CONTAINER_PREFIX:-printops}-spoolman
    restart: unless-stopped
    environment:
      TZ: ${PRINTOPS_TZ:-Europe/Belgrade}
      PUID: ${PRINTOPS_UID:-1000}            # = ultra; Spoolman's entrypoint drops root to this uid
      PGID: ${PRINTOPS_GID:-1000}
      SPOOLMAN_DIR_DATA: /home/app/.local/share/spoolman
      # Spoolman >= 0.26 rejects browser requests whose Origin it does not know. Fluidd calls
      # Spoolman FROM THE BROWSER (its Spoolman dialog + spool selector, GET /api/v1/info), so each
      # Fluidd/Mainsail origin must be listed here, else Fluidd shows "Spoolman is blocking
      # Fluidd's browser origin". Comma-separated FULL origins (scheme required, no path); `*`
      # turns the check off. Moonraker and 3d-api send no Origin header and are unaffected.
      # Default = the fleet's Fluidd origins: K1 SE (:4408, docs/printers/k1se-root-upgrade.md),
      # U1 (port 80, docs/commands/printer-vision.md) and Home Assistant (its printer ingress serves
      # the U1's Fluidd under HA's origin, docs/printops/plan.md). Add Mainsail/tailnet names here.
      SPOOLMAN_CORS_ORIGIN: ${PRINTOPS_SPOOLMAN_CORS_ORIGIN:-http://192.168.0.27:4408,http://192.168.0.26,http://192.168.0.39:8123}
    volumes:
      - ${PRINTOPS_DATA_DIR:-/home/ultra/printops/data}/spoolman:/home/app/.local/share/spoolman
    ports:
      - "${PRINTOPS_BIND_ADDR:-0.0.0.0}:${PRINTOPS_SPOOLMAN_PORT:-7912}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  api:
    build:
      context: ../..
      dockerfile: services/3d-api/Dockerfile
      args:
        PRINTOPS_VERSION: ${PRINTOPS_VERSION:-dev}
    image: printops/3d-api:local          # one tag, rebuilt in place (no per-deploy image pile-up)
    container_name: ${PRINTOPS_CONTAINER_PREFIX:-printops}-api
    restart: unless-stopped
    user: "${PRINTOPS_UID:-1000}:${PRINTOPS_GID:-1000}"   # the host user that owns the bind-mounted data dirs
    depends_on:
      spoolman:
        condition: service_healthy
    environment:
      TZ: ${PRINTOPS_TZ:-Europe/Belgrade}
      SPOOLMAN_URL: http://spoolman:8000
      PRINTOPS_DB: /data/printops.db
      PRINTOPS_TOKENS_FILE: /data/tokens.json
      PRINTOPS_BACKUP_DIR: /backup
      SPOOLMAN_DB: /spoolman-data/spoolman.db
      # Read-only Home Assistant REST for dry-box humidity sensors (printops.homeassistant).
      # Empty URL = humidity unknown. Token: an HA long-lived token in <data>/api/ha_token (0600).
      PRINTOPS_HA_URL: ${PRINTOPS_HA_URL:-}
      PRINTOPS_HA_TOKEN_FILE: /data/ha_token
      # Incident auto-context (#165): G-code dirs inside the container (the host's
      # PRINTOPS_GCODE_HOST_DIR is mounted read-only at /gcodes); FETCH=1 downloads the job's file
      # from a Moonraker printer once (read-only GET) into /data/gcode-cache, off by default.
      PRINTOPS_GCODE_DIRS: ${PRINTOPS_GCODE_DIRS:-/gcodes}
      PRINTOPS_GCODE_FETCH: ${PRINTOPS_GCODE_FETCH:-}
    volumes:
      - ${PRINTOPS_DATA_DIR:-/home/ultra/printops/data}/api:/data
      # read for `3d printops backup` only (SQLite online backup); Spoolman stays the writer
      - ${PRINTOPS_DATA_DIR:-/home/ultra/printops/data}/spoolman:/spoolman-data
      # inside Home Assistant's config dir, so HA's automatic daily backup carries the snapshots
      - ${PRINTOPS_BACKUP_DIR:-/home/ultra/homeassistant/printops-backup}:/backup
      # sliced plates for the incident auto-context (read-only)
      - ${PRINTOPS_GCODE_HOST_DIR:-/home/ultra/printops/gcodes}:/gcodes:ro
    ports:
      - "${PRINTOPS_BIND_ADDR:-0.0.0.0}:${PRINTOPS_API_PORT:-8765}:8765"
