[project]
name = "threed-vision"
version = "0.1.0"
description = "Photo -> 3D tooling primitives: grid calibration, segmentation, open-vocabulary detection, recognition, silhouette fitting, multi-view checks. Shared by the 3d CLI and the hsw-editor vision service."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "scipy>=1.10",
]

[project.optional-dependencies]
# CLIP / DINOv2 / u2net ONNX encoders. CPU build; the GPU build is the `gpu` extra (never both).
onnx = ["onnxruntime>=1.17", "tokenizers>=0.15"]
# GPU ONNX. onnxruntime-gpu >= 1.24 is a CUDA-13 build and silently falls back to CPU on a
# CUDA-12 driver stack (libcublasLt.so.13 missing) -- keep the 1.23 CUDA-12 line pinned.
gpu = ["onnxruntime-gpu==1.23.2", "tokenizers>=0.15"]
# SAM2.1 automatic masks + OWLv2 boxes + the torch soft-silhouette fitter.
# torch/torchvision MUST be the cu128 wheels (download.pytorch.org/whl/cu128): their nvidia-*-cu12 libraries are what
# onnxruntime-gpu 1.23.x loads; a cu130 torch leaves ORT on CPU.
seg = ["torch>=2.8,<2.12", "torchvision>=0.23,<0.27", "sam2>=1.1", "transformers>=4.45", "rembg>=2.0.60"]
# `fit`: torch (soft-silhouette refiner), cma (CMA-ES second attempt), trimesh (glb/stl/obj export). The closed-form fit, view-check and the
# scad export need only the core deps.
fit = ["torch>=2.8,<2.12", "cma>=3.3", "trimesh>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threed_vision"]
