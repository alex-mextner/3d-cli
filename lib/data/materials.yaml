#   shrink_xy_pct  %        — OPTIONAL linear XY shrink of the printed part (consumed by `3d fits resolve`
#                             as slicer shrinkage compensation: scale the model by 100/(100-pct)).
#                             Typical values from https://printfarmcalc.com/reference/shrinkage/ (2026-10):
#                             PLA 0.3, PETG 0.4, TPU 0.6, ASA 0.7, ABS 0.8; brand/colour/temperature dependent.
#   shrink_z_pct   %        — OPTIONAL linear Z shrink. No source records a per-material Z figure, so none is
#                             shipped: `3d fits resolve` says "no Z compensation recorded" until you add one.
#                             A missing field is "not recorded" (provenance entry), never a silent zero.
