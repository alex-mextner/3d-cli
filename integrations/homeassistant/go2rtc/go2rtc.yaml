    - ffmpeg:http://u1-camera-proxy:8090/u1.mjpeg#video=h264
    - http://u1-camera-proxy:8090/u1.mjpeg
  k1se_camera:
    - http://192.168.0.27:8080/?action=stream
    - http://192.168.0.27:4408/webcam/?action=stream
