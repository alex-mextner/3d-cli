# 3D fragments of the HA repo's configuration.yaml (source of truth for these keys).
# configuration.yaml is shared with non-3D config, so these are not copied: `3d ha deploy`
# checks that the live file contains every mapping key and list item below with equal values
# and stops otherwise. These keys stay in configuration.yaml, next to the non-3D ingress panels,
# Lovelace resources and dashboards they are mixed with.
ingress:
  k1_se_printer:
    require_admin: true
    title: K1 SE
    icon: mdi:printer-3d
    url: http://printer-proxy:8080/k1se
    work_mode: ingress
    ui_mode: normal
  u1_printer:
    require_admin: true
    title: U1
    icon: mdi:printer-3d-nozzle
    url: http://printer-proxy:8080/u1
    work_mode: ingress
    ui_mode: normal
frontend:
  # Independent recovery if the Lovelace resource-list request fails during startup.
  extra_module_url:
    - /local/printer-cards/printer-cards-bootstrap.js?v=c36bb7ee325f72f0&entry=frontend
lovelace:
  resources:
    - url: /local/printer-cards/printer-cards-bootstrap.js?v=c36bb7ee325f72f0&entry=lovelace
      type: module
    # Keep the legacy resource: WebRTC otherwise auto-injects it before HA is ready.
    # The printer dashboard uses its isolated, bundled printer-webrtc-camera tag.
    - url: /webrtc/webrtc-camera.js?v=3.6.1
      type: module
  dashboards:
    3d-printers:
      mode: yaml
      title: 3D Printers
      icon: mdi:printer-3d
      show_in_sidebar: true
      filename: ui-3d-printers.yaml
